        /* ─── BENTO GRID ─── */
        .bento-grid {
            display: flex;
            flex-direction: row;
            gap: 24px;
            padding: 10px 0;
        }
        .bento-card {
            border: 2px solid rgba(0,0,0,0.20);
            box-shadow: 5px 5px 0 rgba(0,0,0,0.15);
            border-radius: 18px;
            padding: 0;
            overflow: hidden;
            text-decoration: none;
            display: block;
            background: rgba(255,255,255,0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.18s cubic-bezier(.4,0,.2,1), box-shadow 0.18s cubic-bezier(.4,0,.2,1), background 0.18s;
            cursor: pointer;
            flex: 1;
            position: relative;
        }
        .bento-card:hover {
            transform: translate(-3px,-3px);
            box-shadow: 8px 8px 0 rgba(0,0,0,0.20);
            background: rgba(255,255,255,0.62);
        }
        .bento-card:active {
            transform: translate(2px,2px);
            box-shadow: 3px 3px 0 rgba(0,0,0,0.12);
        }
        .bento-inner {
            padding: 18px 17px 14px 17px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            aspect-ratio: 1 / 0.6;
        }
        .bento-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: bold;
            opacity: 0.45;
            color: #000;
            margin-bottom: 5px;
        }
        .bento-title {
            font-size: 1.35rem;
            font-family: 'Special Elite', cursive;
            font-weight: bold;
            color: #000;
            line-height: 1.05;
            margin: 0 0 7px 0;
        }
        .bento-desc {
            font-size: 0.52rem;
            color: #333;
            line-height: 1.5;
            flex: 1;
            margin-bottom: 11px;
        }
        .bento-arrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.58rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #000;
            border: 2px solid rgba(0,0,0,0.30);
            border-radius: 50px;
            padding: 5px 12px;
            background: rgba(0,0,0,0.06);
            transition: background 0.15s;
            width: fit-content;
        }
        .bento-card:hover .bento-arrow { background: rgba(0,0,0,0.11); }
        .bento-icon {
            font-size: 1.7rem;
            opacity: 0.09;
            position: absolute;
            bottom: 14px;
            right: 16px;
            pointer-events: none;
            color: #000;
        }

            .d-menu-btn:hover::after { opacity: 1; }

            .d-arrow-wrapper { margin-left: auto; padding-right: 5px; }

            .d-submenu a i { margin-right: 10px; width: 18px; text-align: center; }
            .d-nav-item-epk { margin-top: auto; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 15px; }
            .d-nav-item-epk a { color: var(--anton-red) !important; font-weight: bold; }
            .d-sidebar-right { position: fixed; top: 50%; right: 0; transform: translateY(-50%); width: 50px; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 999; background: rgba(255,255,255,0.2); backdrop-filter: blur(3px); padding: 25px 0; border-radius: 20px 0 0 20px; }
            .d-sidebar-right a i { color: #000; font-size: 1.2rem; animation: ultraFlowWave 6s linear infinite; }

            .d-sidebar-right a:nth-child(2) i { --brand-color: #25F4EE; animation-delay: 0.25s; }
            .d-sidebar-right a:nth-child(3) i { --brand-color: #E1306C; animation-delay: 0.5s; }

            .d-footer { width: 100%; padding: 15px 0; background: rgba(255,255,255,0.95); border-top: 1.5px solid #000; text-align: center; font-size: 0.75rem; z-index: 100; position: fixed; bottom: 0; left: 0; }
            .d-footer a { color: #000; text-decoration: none; margin: 0 12px; font-weight: bold; transition: all 0.3s ease; }
            .d-footer a:hover { color: var(--anton-yellow) !important; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; }
        }

            #mobile-wrapper  { display: block !important; }

    <script>
    // ─── BENTO CONTENT ───
    var DS_HTML = `
<p style="font-size:0.62rem;margin:0 0 14px 0;opacity:0.55;text-transform:uppercase;letter-spacing:0.12em;">Datenschutz</p>
<div class="bento-grid">
  <a href="datenschutzweb.html" class="bento-card">
    <div class="bento-inner">
      <div>
        <div class="bento-label">Datenschutz</div>
        <div class="bento-title">Webseite</div>
        <div class="bento-desc">Informationen zum Datenschutz rund um das Onlineangebot, Webhosting, Cookies und eingebettete Inhalte.</div>
      </div>
      <div class="bento-arrow">Öffnen &rarr;</div>
    </div>
    <i class="fa-solid fa-globe bento-icon"></i>
  </a>
  <a href="datenschutzshop.html" class="bento-card">
    <div class="bento-inner">
      <div>
        <div class="bento-label">Datenschutz</div>
        <div class="bento-title">Shop</div>
        <div class="bento-desc">Datenschutzinformationen für den Shop-Bereich, Bestellvorgänge, Zahlungsdaten und Vertragsabwicklung.</div>
      </div>
      <div class="bento-arrow">Öffnen &rarr;</div>
    </div>
    <i class="fa-solid fa-cart-shopping bento-icon"></i>
  </a>
</div>
`;

    // Inject content into both desktop and mobile
    var d = document.getElementById('datenschutz-content');
    var m = document.getElementById('datenschutz-content-m');
    if (d) d.innerHTML = DS_HTML;
    if (m) m.innerHTML = DS_HTML;

    // ─── DESKTOP SIDEBAR ───
    var dSidebarTimeout;
    var dSidebar = document.getElementById('d-sidebar');
    function resetDSidebarTimer() { clearTimeout(dSidebarTimeout); if (dSidebar && dSidebar.classList.contains('open')) dSidebarTimeout = setTimeout(function() { dSidebar.classList.remove('open'); }, 5000); }
    function toggleDesktopMenu() { if (dSidebar) { dSidebar.classList.toggle('open'); if (dSidebar.classList.contains('open')) resetDSidebarTimer(); } }
    if (dSidebar) { dSidebar.addEventListener('mousemove', resetDSidebarTimer); dSidebar.addEventListener('click', resetDSidebarTimer); }
    document.addEventListener('click', function(e) {
        if (window.innerWidth > 800) {
            var btn = document.getElementById('d-menu-btn');
            if (dSidebar && btn && !dSidebar.contains(e.target) && !btn.contains(e.target) && dSidebar.classList.contains('open')) { dSidebar.classList.remove('open'); clearTimeout(dSidebarTimeout); }
        }
    });

    // ─── MOBILE ───
    var mSidebar = document.getElementById('m-sidebar');
    var mMenuBtn = document.getElementById('m-menu-trigger');
    var mIdBtn   = document.getElementById('m-id-btn');
    var mIdPanel = document.getElementById('m-id-panel');
    var mMenuTimeout, mIdTimeout;

    function isLandscapeMobile() { return window.innerHeight <= 500 && window.innerWidth > window.innerHeight; }

    function mCloseAllMenus() {
        if (mSidebar) mSidebar.classList.remove('open');
        if (mMenuBtn) mMenuBtn.classList.remove('active');
        clearTimeout(mMenuTimeout);
        if (!isLandscapeMobile()) {
            if (mIdPanel) mIdPanel.classList.remove('open');
            if (mIdBtn) mIdBtn.classList.remove('hidden');
            clearTimeout(mIdTimeout);
        }
    }
    function mToggleMenu(e) {
        e.stopPropagation();
        if (mSidebar.classList.contains('open')) { mCloseAllMenus(); }
        else { mCloseAllMenus(); mSidebar.classList.add('open'); mMenuBtn.classList.add('active'); mMenuTimeout = setTimeout(mCloseAllMenus, 5000); }
    }
    function mOpenIDMenu(e) {
        e.stopPropagation(); mCloseAllMenus();
        if (mIdBtn) mIdBtn.classList.add('hidden');
        if (mIdPanel) mIdPanel.classList.add('open');
        mIdTimeout = setTimeout(mCloseAllMenus, 5000);
    }

    function applyLandscapeState() {
        if (isLandscapeMobile()) {
            if (mIdPanel) mIdPanel.style.cssText = '';
            if (mIdBtn) mIdBtn.style.display = 'none';
        } else {
            if (mIdBtn) mIdBtn.style.display = '';
            if (mIdPanel) mIdPanel.classList.remove('open');
        }
    }
    window.addEventListener('resize', applyLandscapeState);
    window.addEventListener('orientationchange', function() { setTimeout(applyLandscapeState, 100); });
    applyLandscapeState();

    document.addEventListener('click', function(e) {
        if (window.innerWidth <= 800 || isLandscapeMobile()) {
            if (mSidebar && mMenuBtn && mIdPanel && mIdBtn &&
                !mSidebar.contains(e.target) && !mMenuBtn.contains(e.target) &&
                !mIdPanel.contains(e.target) && !mIdBtn.contains(e.target)) mCloseAllMenus();
        }
    });

    setTimeout(function() {
        var mh = document.getElementById('m-header-main');
        var isLandscape = isLandscapeMobile();
        if (mh && (window.innerWidth <= 800 || isLandscape)) {
            mh.style.transform = 'translateY(0)';
            setTimeout(function() { mh.style.transform = 'translateY(-100%)'; }, 3000);
        }
    }, 100);
    </script>
